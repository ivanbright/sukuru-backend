spring:
  config:
    import: "optional:file:./.env[.properties]"
  application:
    name: shop
  datasource:
    url: ${DB_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5436}/${PGDATABASE:shop}?stringtype=unspecified}
    username: ${DB_USER:app_runtime}
    password: ${DB_PASSWORD:change-me-runtime}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 1
      connection-timeout: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: ${FLYWAY_URL:${DB_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5436}/${PGDATABASE:shop}?stringtype=unspecified}}
    user: ${FLYWAY_USER:${PGUSER:app_migrator}}
    password: ${FLYWAY_PASSWORD:${PGPASSWORD:change-me-migrator}}
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-swallow-size: 1MB
    max-http-form-post-size: 1MB

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    rw.shop: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:rw-shop}
    access-token-minutes: 15
    refresh-token-days: 30
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  billing:
    mobile-money-number: ${BILLING_MOBILE_MONEY_NUMBER:+250783453911}
    support-email: ${BILLING_SUPPORT_EMAIL:mugishaivanbright250@gmail.com}
    admin-key: ${BILLING_ADMIN_KEY:}
  rate-limit:
    login-per-ip-per-minute: 10
    login-failures-per-email-per-15-minutes: 5
  idempotency:
    retention-hours: 48
  cleanup:
    cron: "0 0 3 * * *"
