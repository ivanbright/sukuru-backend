services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shop}
      POSTGRES_USER: ${POSTGRES_USER:-app_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-migrator}
      APP_RUNTIME_PASSWORD: ${APP_RUNTIME_PASSWORD:-change-me-runtime}
    ports:
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_migrator} -d ${POSTGRES_DB:-shop}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-shop}?stringtype=unspecified
      DB_USER: app_runtime
      DB_PASSWORD: ${APP_RUNTIME_PASSWORD:-change-me-runtime}
      FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-shop}?stringtype=unspecified
      FLYWAY_USER: ${POSTGRES_USER:-app_migrator}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-change-me-migrator}
      JWT_SECRET: ${JWT_SECRET:-change-me-32-bytes-minimum-secret-value}
      JWT_ISSUER: ${JWT_ISSUER:-rw-shop}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      PORT: 8080
    ports:
      - "8080:8080"

volumes:
  pgdata:
